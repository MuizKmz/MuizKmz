<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="1000" height="8" role="img" aria-label="">
  <defs>
    <linearGradient id="base" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0"    stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.2"  stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.5"  stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="0.8"  stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8fbff" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-260 0; 1060 0" dur="3.4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="1000" height="1.6" rx="0.8" fill="url(#base)"/>
  <rect x="0" y="2.6" width="1000" height="2.4" rx="1.2" fill="url(#pulse)"/>
</svg>
