<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" role="img" aria-label="View live portfolio at muizkmz.vercel.app — responsive web and mobile">
  <title>View live portfolio — muizkmz.vercel.app</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0b0818"/>
      <stop offset="0.55" stop-color="#150e2e"/>
      <stop offset="1"   stop-color="#0a0714"/>
    </linearGradient>
    <radialGradient id="pglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ptitle" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
      <stop offset="0"    stop-color="#c4b5fd"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1"    stop-color="#e879f9"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-340 0; 1060 0; -340 0" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="psoft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bar   { animation: sweep 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
      .b2    { animation-delay: -.5s } .b3 { animation-delay: -1s }
      .b4    { animation-delay: -1.5s } .b5 { animation-delay: -2s }
      .live  { animation: lpulse 1.8s ease-in-out infinite; }
      .arrow { animation: nudge 1.9s ease-in-out infinite; }
      .scan  { animation: scan 3.6s linear infinite; }
      @keyframes sweep  { 0%,100% { transform:scaleX(.45) } 50% { transform:scaleX(1) } }
      @keyframes lpulse { 0%,100% { opacity:.3 } 50% { opacity:1 } }
      @keyframes nudge  { 0%,100% { transform:translateX(0) } 50% { transform:translateX(6px) } }
      @keyframes scan   { 0% { transform:translateY(0); opacity:0 } 12% { opacity:.55 } 88% { opacity:.55 } 100% { transform:translateY(78px); opacity:0 } }
      @media (prefers-reduced-motion: reduce) { .bar,.live,.arrow,.scan { animation:none } }
    </style>
    <clipPath id="screenclip"><rect x="70" y="48" width="148" height="78" rx="3"/></clipPath>
  </defs>

  <rect width="1000" height="160" rx="16" fill="#0a0714"/>
  <rect width="1000" height="160" rx="16" fill="url(#pbg)"/>
  <ellipse cx="200" cy="80" rx="260" ry="150" fill="url(#pglow)"/>

  <!-- desktop frame -->
  <rect x="64" y="34" width="160" height="98" rx="7" fill="#0d0a1f" stroke="#7c3aed" stroke-width="1.6"/>
  <rect x="64" y="34" width="160" height="14" rx="7" fill="#1a1033"/>
  <circle cx="76" cy="41" r="2.2" fill="#e879f9"/><circle cx="85" cy="41" r="2.2" fill="#a78bfa"/><circle cx="94" cy="41" r="2.2" fill="#22d3ee"/>
  <g clip-path="url(#screenclip)">
    <rect x="70" y="48" width="148" height="78" fill="#120c26"/>
    <rect class="bar"    x="80" y="58"  width="120" height="7" rx="3.5" fill="#a78bfa" opacity="0.85"/>
    <rect class="bar b2" x="80" y="72"  width="96"  height="5" rx="2.5" fill="#6d28d9" opacity="0.8"/>
    <rect class="bar b3" x="80" y="83"  width="110" height="5" rx="2.5" fill="#6d28d9" opacity="0.6"/>
    <rect class="bar b4" x="80" y="100" width="52"  height="18" rx="3" fill="#e879f9" opacity="0.45"/>
    <rect class="bar b5" x="140" y="100" width="52" height="18" rx="3" fill="#22d3ee" opacity="0.35"/>
    <rect class="scan" x="70" y="48" width="148" height="10" fill="#e0d4ff" opacity="0"/>
  </g>
  <rect x="132" y="132" width="24" height="4" rx="2" fill="#7c3aed" opacity="0.7"/>

  <!-- phone frame -->
  <rect x="236" y="50" width="50" height="90" rx="9" fill="#0d0a1f" stroke="#e879f9" stroke-width="1.6"/>
  <rect x="253" y="55" width="16" height="2.6" rx="1.3" fill="#e879f9" opacity="0.6"/>
  <rect x="242" y="64" width="38" height="24" rx="3" fill="#2a1450"/>
  <rect class="bar b2" x="242" y="93"  width="38" height="4" rx="2" fill="#a78bfa" opacity="0.8"/>
  <rect class="bar b3" x="242" y="101" width="28" height="4" rx="2" fill="#6d28d9" opacity="0.7"/>
  <rect class="bar b4" x="242" y="109" width="33" height="4" rx="2" fill="#6d28d9" opacity="0.5"/>
  <rect x="252" y="130" width="18" height="2.4" rx="1.2" fill="#e879f9" opacity="0.5"/>

  <!-- copy -->
  <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace">
    <circle class="live" cx="336" cy="45" r="4" fill="#4ade80" filter="url(#psoft)"/>
    <text x="348" y="49" font-size="10.5" letter-spacing="2.6" fill="#4ade80">LIVE</text>
    <text x="392" y="49" font-size="10.5" letter-spacing="2.6" fill="#475569">· PORTFOLIO SITE</text>

    <text x="334" y="92" font-size="30" font-weight="700" letter-spacing="1" fill="url(#ptitle)">VIEW MY PORTFOLIO</text>

    <text x="336" y="119" font-size="14" letter-spacing="0.6" fill="#22d3ee">muizkmz.vercel.app</text>

    <text x="336" y="142" font-size="10" letter-spacing="2" fill="#64748b">RESPONSIVE<tspan fill="#a78bfa"> · </tspan>WEB<tspan fill="#e879f9"> · </tspan>MOBILE<tspan fill="#a78bfa"> · </tspan>PROJECT ARCHIVE</text>
  </g>

  <!-- arrow -->
  <g class="arrow" stroke="#e879f9" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M902 80 H936"/><path d="M924 68 L936 80 L924 92"/>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="158.5" rx="16" fill="none" stroke="#2a1f4a" stroke-width="1.5"/>
</svg>
