<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Muiz Kamarozaman — Software Developer. IoT, AI, Full-Stack, Mobile.">
  <title>Muiz Kamarozaman — Software Developer</title>

  <defs>
    <!-- backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#080d1a"/>
      <stop offset="0.5" stop-color="#0c1226"/>
      <stop offset="1"   stop-color="#080a14"/>
    </linearGradient>

    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <!-- shimmer sweep across the name -->
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0">
      <stop offset="0.00" stop-color="#67e8f9"/>
      <stop offset="0.38" stop-color="#e8fbff"/>
      <stop offset="0.50" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f0e9ff"/>
      <stop offset="1.00" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-420 0; 1060 0; -420 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="750" y2="0">
      <stop offset="0"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- fade the grid out toward the centre so text stays clean -->
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.28" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.72" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1.00" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1000" height="300" fill="url(#fadeX)"/></mask>

    <style>
      .node   { animation: breathe 3.4s ease-in-out infinite; transform-origin: center; }
      .node.b { animation-delay: -1.1s; }
      .node.c { animation-delay: -2.2s; }
      .ring   { animation: ping 3.4s cubic-bezier(.2,.6,.3,1) infinite; transform-box: fill-box; transform-origin: center; }
      .ring.b { animation-delay: -1.1s; }
      .ring.c { animation-delay: -2.2s; }
      .drift  { animation: drift 7s linear infinite; }
      .caret  { animation: blink 1.05s steps(1) infinite; }
      .tag    { animation: fadeUp 5s ease-in-out infinite; }
      .tag.t2 { animation-delay: -1.25s; }
      .tag.t3 { animation-delay: -2.5s; }
      .tag.t4 { animation-delay: -3.75s; }

      @keyframes breathe { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes ping    { 0% { transform:scale(.4); opacity:.75 } 70%,100% { transform:scale(2.6); opacity:0 } }
      @keyframes drift   { from { transform:translateX(0) } to { transform:translateX(44px) } }
      @keyframes blink   { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes fadeUp  { 0%,100% { opacity:.35 } 50% { opacity:.95 } }

      @media (prefers-reduced-motion: reduce) {
        .node,.ring,.drift,.caret,.tag { animation: none !important; opacity:.8 }
      }
    </style>
  </defs>

  <!-- ── backdrop ───────────────────────────────────────────── -->
  <rect width="1000" height="300" rx="18" fill="#090e1c"/>
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <ellipse cx="150" cy="120" rx="300" ry="190" fill="url(#glowL)"/>
  <ellipse cx="860" cy="200" rx="300" ry="190" fill="url(#glowR)"/>

  <!-- ── drifting circuit grid ──────────────────────────────── -->
  <g mask="url(#gridMask)" opacity="0.5">
    <g class="drift">
      <g stroke="#1e3a5f" stroke-width="1">
        <path d="M-44 0V300M0 0V300M44 0V300M88 0V300M132 0V300M176 0V300M220 0V300M264 0V300M308 0V300M352 0V300M396 0V300M440 0V300M484 0V300M528 0V300M572 0V300M616 0V300M660 0V300M704 0V300M748 0V300M792 0V300M836 0V300M880 0V300M924 0V300M968 0V300M1012 0V300"/>
      </g>
    </g>
    <g stroke="#1e3a5f" stroke-width="1">
      <path d="M0 40H1000M0 84H1000M0 128H1000M0 172H1000M0 216H1000M0 260H1000"/>
    </g>
  </g>

  <!-- ── left cluster: IoT mesh ─────────────────────────────── -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.55">
    <path id="p1" d="M60 210 L60 150 L130 110 L215 110"/>
    <path id="p2" d="M60 210 L145 210 L200 178"/>
    <path id="p3" d="M130 110 L130 62 L212 62"/>
  </g>
  <g fill="#22d3ee" filter="url(#soft)">
    <circle class="node"   cx="60"  cy="210" r="4.5"/>
    <circle class="node b" cx="130" cy="110" r="4.5"/>
    <circle class="node c" cx="130" cy="62"  r="3.5"/>
    <circle class="node b" cx="145" cy="210" r="3.5"/>
  </g>
  <g fill="none" stroke="#22d3ee" stroke-width="1.4">
    <circle class="ring"   cx="60"  cy="210" r="5"/>
    <circle class="ring b" cx="130" cy="110" r="5"/>
    <circle class="ring c" cx="130" cy="62"  r="5"/>
  </g>
  <g fill="#e8fbff">
    <circle r="2.6"><animateMotion dur="3.6s" repeatCount="indefinite" begin="0s"   path="M60 210 L60 150 L130 110 L215 110"/></circle>
    <circle r="2.6"><animateMotion dur="3.2s" repeatCount="indefinite" begin="1.4s" path="M60 210 L145 210 L200 178"/></circle>
    <circle r="2.2"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0.7s" path="M130 110 L130 62 L212 62"/></circle>
  </g>

  <!-- ── right cluster: AI / agents ─────────────────────────── -->
  <g fill="none" stroke="#a78bfa" stroke-width="1.6" opacity="0.55">
    <path id="p4" d="M940 90 L940 150 L868 190 L785 190"/>
    <path id="p5" d="M940 90 L858 90 L800 122"/>
    <path id="p6" d="M868 190 L868 238 L788 238"/>
  </g>
  <g fill="#a78bfa" filter="url(#soft)">
    <circle class="node b" cx="940" cy="90"  r="4.5"/>
    <circle class="node"   cx="868" cy="190" r="4.5"/>
    <circle class="node c" cx="868" cy="238" r="3.5"/>
    <circle class="node"   cx="858" cy="90"  r="3.5"/>
  </g>
  <g fill="none" stroke="#a78bfa" stroke-width="1.4">
    <circle class="ring b" cx="940" cy="90"  r="5"/>
    <circle class="ring"   cx="868" cy="190" r="5"/>
    <circle class="ring c" cx="868" cy="238" r="5"/>
  </g>
  <g fill="#f3ecff">
    <circle r="2.6"><animateMotion dur="3.4s" repeatCount="indefinite" begin="0.5s" path="M940 90 L940 150 L868 190 L785 190"/></circle>
    <circle r="2.6"><animateMotion dur="3.0s" repeatCount="indefinite" begin="1.9s" path="M940 90 L858 90 L800 122"/></circle>
    <circle r="2.2"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.1s" path="M868 190 L868 238 L788 238"/></circle>
  </g>

  <!-- ── corner brackets ────────────────────────────────────── -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7">
    <path d="M28 52 V28 H52"/><path d="M972 52 V28 H948"/>
  </g>
  <g stroke="#a78bfa" stroke-width="2" fill="none" opacity="0.7">
    <path d="M28 248 V272 H52"/><path d="M972 248 V272 H948"/>
  </g>

  <!-- ── type ───────────────────────────────────────────────── -->
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace">
    <text x="500" y="96" font-size="13" letter-spacing="6" fill="#5eead4" opacity="0.85">SOFTWARE  DEVELOPER</text>

    <text x="500" y="158" font-size="46" font-weight="700" letter-spacing="2" fill="url(#shimmer)">MUIZ KAMAROZAMAN</text>

    <rect x="250" y="178" width="500" height="1.5" fill="url(#rule)"/>

    <text x="500" y="212" font-size="15" letter-spacing="1.5" fill="#94a3b8">
      IoT<tspan fill="#22d3ee"> · </tspan>AI<tspan fill="#22d3ee"> · </tspan>Full-Stack<tspan fill="#22d3ee"> · </tspan>Mobile
    </text>

    <text x="500" y="252" font-size="13" fill="#64748b">
      <tspan fill="#34d399">$</tspan> building real-time systems<tspan class="caret" fill="#22d3ee">_</tspan>
    </text>
  </g>

  <!-- ── floating side tags ─────────────────────────────────── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1">
    <text class="tag"    x="60"  y="258" fill="#22d3ee">MQTT</text>
    <text class="tag t2" x="60"  y="38"  fill="#22d3ee">SOCKET.IO</text>
    <text class="tag t3" x="880" y="38"  fill="#a78bfa">AGENTS</text>
    <text class="tag t4" x="884" y="272" fill="#a78bfa">LLM</text>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="298.5" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>
